name: Secure Stream DevSecOps Pipeline

on:
push:
branches: [ main, feature-kubernetes, snyk-trivy ]
pull_request:
branches: [ main ]

jobs:
security-pipeline:
runs-on: ubuntu-latest

```
steps:
  # STEP 1: Checkout Code
  - name: Checkout Code
    uses: actions/checkout@v4

  # STEP 2: Setup Python
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  # STEP 3: Bandit SAST Scan
  - name: Install Bandit
    run: pip install bandit

  - name: Run Bandit Security Scan
    run: bandit -r src/ -ll

  # STEP 4: Install Dependencies
  - name: Install Dependencies
    run: pip install -r requirements.txt

  # STEP 5: Snyk Dependency Scan
  - name: Snyk Scan
    uses: snyk/actions/python@master
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    with:
      args: --severity-threshold=high

  # STEP 6: Build Docker Image
  - name: Build Docker Image
    run: docker build -t secure-stream-app .

  # STEP 7: Trivy Container Scan
  - name: Trivy Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: secure-stream-app
      format: table
      severity: HIGH,CRITICAL
      exit-code: 0

  # STEP 8: Kubernetes Configuration Scan
  - name: Trivy Kubernetes Config Scan
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: config
      scan-ref: k8s/
      format: table

  # STEP 9: Run Flask Application
  - name: Run Flask in Background
    run: |
      docker run -d -p 5000:5000 --name flask-app secure-stream-app

  - name: Wait for Application
    run: sleep 15

  # STEP 10: OWASP ZAP DAST Scan
  - name: Run OWASP ZAP Scan
    run: |
      docker run --rm --network host \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py \
        -t http://localhost:5000

